<article class="post-card" data-cat="{{ p.cat }}">
  <a class="thumb {{ p.cat }}" href="{{ p.url }}" tabindex="-1" aria-hidden="true">
    <span class="thumb-label">{{ p.cat_label }}</span>
    <span class="thumb-title">{{ p.title }}</span>
    {% if p.image %}<img src="{{ p.image }}" alt="" loading="lazy" decoding="async" width="640" height="360" onerror="this.remove()">{% endif %}
  </a>
  <div class="meta">{{ p.cat_label }}, {{ p.date_human }}</div>
  <h3><a href="{{ p.url }}">{{ p.title }}</a></h3>
  <p>{{ p.description }}</p>
</article>
