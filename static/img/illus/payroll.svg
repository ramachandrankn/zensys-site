<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Zensys payroll: a team running payday. Attendance calendar, payslip with net pay, salary envelope, on-time stopwatch, coins and money bag. -->
  <!-- background blob and faint doodles -->
  <path d="M352 86c40 46 36 132-14 174s-146 42-216 18S12 216 22 146 92 30 174 22s138 18 178 64z" fill="#EEEDF9"/>
  <g stroke="#D6D3EE" stroke-width="2.5">
    <circle cx="44" cy="62" r="6"/><path d="M78 30l8 8m0-8l-8 8M362 40l8 8m0-8l-8 8M24 118h12M30 112v12"/>
    <path d="M118 44l8 14h-16z"/><circle cx="374" cy="168" r="5"/><rect x="242" y="20" width="12" height="12" rx="2"/>
    <path d="M300 34c6-8 16-8 20 0M380 240l8 8m0-8l-8 8"/>
  </g>

  <!-- attendance calendar -->
  <g stroke="#2E2870" stroke-width="3">
    <rect x="36" y="150" width="176" height="126" rx="10" fill="#fff"/>
    <path d="M36 160a10 10 0 0 1 10-10h156a10 10 0 0 1 10 10v16H36z" fill="#D53029"/>
  </g>
  <g fill="#2E2870"><rect x="56" y="142" width="6" height="16" rx="3"/><rect x="86" y="142" width="6" height="16" rx="3"/><rect x="116" y="142" width="6" height="16" rx="3"/><rect x="146" y="142" width="6" height="16" rx="3"/><rect x="176" y="142" width="6" height="16" rx="3"/></g>
  <g fill="#E2E0F2">
    <rect x="50" y="188" width="18" height="14" rx="3"/><rect x="74" y="188" width="18" height="14" rx="3"/><rect x="98" y="188" width="18" height="14" rx="3"/><rect x="122" y="188" width="18" height="14" rx="3"/>
    <rect x="50" y="208" width="18" height="14" rx="3"/><rect x="98" y="208" width="18" height="14" rx="3"/><rect x="122" y="208" width="18" height="14" rx="3"/>
    <rect x="50" y="228" width="18" height="14" rx="3"/><rect x="74" y="228" width="18" height="14" rx="3"/><rect x="122" y="228" width="18" height="14" rx="3"/>
    <rect x="50" y="248" width="18" height="14" rx="3"/><rect x="74" y="248" width="18" height="14" rx="3"/>
  </g>
  <g fill="#453E8F"><rect x="74" y="208" width="18" height="14" rx="3"/><rect x="98" y="228" width="18" height="14" rx="3"/></g>
  <g fill="#1E7A57"><rect x="98" y="248" width="18" height="14" rx="3"/></g>

  <!-- date bubble -->
  <g stroke="#2E2870" stroke-width="3">
    <path d="M28 74h52a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8H58l-10 10v-10H28a8 8 0 0 1-8-8V82a8 8 0 0 1 8-8z" fill="#453E8F"/>
    <rect x="34" y="84" width="40" height="32" rx="4" fill="#fff"/>
    <path d="M34 94h40" />
  </g>
  <text x="54" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#D53029">31</text>

  <!-- salary envelope with rupee notes -->
  <g stroke="#2E2870" stroke-width="3">
    <rect x="186" y="62" width="34" height="50" rx="3" fill="#1E7A57" transform="rotate(-18 203 87)"/>
    <rect x="206" y="56" width="34" height="50" rx="3" fill="#1E7A57" transform="rotate(4 223 81)"/>
    <rect x="226" y="62" width="34" height="50" rx="3" fill="#1E7A57" transform="rotate(22 243 87)"/>
    <path d="M172 94h104v52H172z" fill="#E9E7F7"/>
    <path d="M172 94l52 30 52-30" fill="#fff"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="200" y="88" transform="rotate(-18 200 84)">₹</text><text x="223" y="80">₹</text><text x="246" y="88" transform="rotate(22 246 84)">₹</text></g>

  <!-- stopwatch: paid on time -->
  <g stroke="#2E2870" stroke-width="3">
    <rect x="326" y="50" width="16" height="10" rx="2" fill="#D53029"/>
    <path d="M356 66l8-8" />
    <circle cx="334" cy="102" r="38" fill="#fff"/>
    <circle cx="334" cy="102" r="30" stroke="#D53029" stroke-width="3"/>
    <path d="M334 82v20l14 10" stroke-width="4"/>
  </g>
  <g fill="#2E2870"><circle cx="334" cy="78" r="2"/><circle cx="358" cy="102" r="2"/><circle cx="334" cy="126" r="2"/><circle cx="310" cy="102" r="2"/></g>

  <!-- payslip -->
  <g stroke="#2E2870" stroke-width="3">
    <rect x="150" y="168" width="214" height="104" rx="10" fill="#fff"/>
  </g>
  <text x="168" y="194" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2E2870" letter-spacing="1">PAYSLIP</text>
  <g stroke="#453E8F" stroke-width="4"><path d="M168 208h120M168 220h96"/></g>
  <rect x="166" y="234" width="122" height="24" rx="12" fill="#D53029" stroke="#2E2870" stroke-width="2.5"/>
  <text x="227" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">NET PAY ₹38,900</text>
  <path d="M300 246c6-10 10 8 16-2s8 6 14-2" stroke="#2E2870" stroke-width="2.5"/>
  <circle cx="346" cy="186" r="11" fill="#1E7A57" stroke="#2E2870" stroke-width="2.5"/>
  <path d="M341 186l4 4 7-8" stroke="#fff" stroke-width="3"/>

  <!-- coins and money bag -->
  <g stroke="#2E2870" stroke-width="3">
    <path d="M150 284v-10h56v10c0 4-12 7-28 7s-28-3-28-7z" fill="#D53029"/><ellipse cx="178" cy="274" rx="28" ry="7" fill="#D53029"/>
    <path d="M150 274v-10h56v10" fill="#D53029"/><ellipse cx="178" cy="264" rx="28" ry="7" fill="#fff"/>
  </g>
  <text x="178" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#2E2870">₹</text>
  <g stroke="#2E2870" stroke-width="3">
    <path d="M18 284c-6-26 8-44 22-50l-6-10h28l-6 10c14 6 28 24 22 50z" fill="#453E8F"/>
    <path d="M36 234h24"/>
  </g>
  <text x="48" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">₹</text>

  <!-- person 1: sitting on the calendar with a calculator -->
  <g stroke="#2E2870" stroke-width="2.5">
    <path d="M92 148h16v26M100 148h16v26" stroke-width="5"/>
    <path d="M104 176h8M112 176h8" stroke-width="5"/>
    <path d="M86 150c-2-14 0-28 10-32h10c8 4 8 20 6 32z" fill="#D53029"/>
    <circle cx="100" cy="106" r="10" fill="#C98B64"/>
    <path d="M90 104c0-9 7-13 13-12 6 1 8 6 7 10-5-3-12-2-20 2z" fill="#2E2870"/>
    <rect x="112" y="116" width="30" height="40" rx="4" fill="#fff" transform="rotate(10 127 136)"/>
    <path d="M110 130l8 4" stroke-width="4"/>
  </g>
  <g transform="rotate(10 127 136)"><rect x="116" y="120" width="22" height="8" rx="1.5" fill="#453E8F"/><g fill="#2E2870"><circle cx="120" cy="134" r="2"/><circle cx="127" cy="134" r="2"/><circle cx="134" cy="134" r="2"/><circle cx="120" cy="141" r="2"/><circle cx="127" cy="141" r="2"/><circle cx="134" cy="141" r="2"/><circle cx="120" cy="148" r="2"/><circle cx="127" cy="148" r="2"/><circle cx="134" cy="148" r="2" fill="#D53029"/></g></g>

  <!-- person 2: filling the salary envelope -->
  <g stroke="#2E2870" stroke-width="2.5">
    <path d="M290 168l2-30M302 168l-2-30" stroke-width="5"/>
    <path d="M282 140l6-36h14l8 36z" fill="#453E8F"/>
    <path d="M288 112l-14 12" stroke-width="4"/>
    <circle cx="296" cy="92" r="10" fill="#B9774F"/>
    <path d="M286 92c-1-10 6-14 12-13 7 1 10 8 8 18 2 6 0 12-4 14 0-8 0-14-4-18-4 2-8 1-12-1z" fill="#2E2870"/>
  </g>

  <!-- person 3: kneeling, signing the payslip -->
  <g stroke="#2E2870" stroke-width="2.5" transform="translate(-10 0)">
    <path d="M372 286h-14l-4-16M386 286l-4-20" stroke-width="5"/>
    <path d="M362 270c-4-14-2-28 6-34h12c8 6 8 22 4 34z" fill="#2E2870"/>
    <path d="M364 244l-24 6" stroke-width="4"/>
    <path d="M340 250l-14 2" stroke="#D53029" stroke-width="3"/>
    <circle cx="374" cy="226" r="10" fill="#8E5A3B"/>
    <path d="M364 224c0-9 6-12 11-12 6 0 10 4 9 10-6-2-13-1-20 2z" fill="#2E2870"/>
  </g>

  <!-- sparkles -->
  <path d="M136 64l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM280 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#453E8F"/>
